apiVersion: v1
kind: ConfigMap
metadata:
  name: "{{ .Release.Name }}-terra-metadata"
  labels:
    # This label tells Genesis to include this plugin in the workload
    # template catalog. The value must point to the scripts ConfigMap.
    kuiper.juno-innovations.com/chart: "{{ .Release.Name }}-scripts-configmap"
  annotations:
    # Categorizes this workload in the Genesis UI workload table.
    # Valid values: Application | Terminal | Workspace | Server | Virtual Machine
    juno-innovations.com/workload: "Server"
data:
  # Must point to the scripts ConfigMap — Genesis reads packaged_scripts.base64 from it.
  chart: "{{ .Release.Name }}-scripts-configmap"
  description: "PLUGIN workload template"
  # The fields schema drives the Genesis workload-creation UI.
  # Every field here becomes a Helm value passed into scripts/chart/ by
  # Kuiper at launch time. Field defaults OVERRIDE scripts/chart/values.yaml
  # defaults — keep them in sync (dual-defaults parity).
  fields: |
    - name: icon
      default: ""
    - name: registry
      description: "Container registry"
      type: string
      required: true
      default: "docker.io"
    - name: repo
      description: "Image repository"
      type: string
      required: true
      default: "PLUGIN"
    - name: tag
      description: "Image tag"
      type: string
      required: true
      default: "latest"
    - name: cpu
      description: "CPU cores (request)"
      type: string
      required: false
      default: "1"
    - name: memory
      description: "Memory request"
      type: string
      required: false
      default: "1Gi"
    - name: cpuLimit
      description: "CPU limit (empty = no limit)"
      type: string
      required: false
      default: ""
    - name: memoryLimit
      description: "Memory limit (empty = no limit)"
      type: string
      required: false
      default: ""
    - name: service_type
      description: "Service type — NodePort (high port on every node) or LoadBalancer (external IP via MetalLB/cloud LB)"
      type: select
      options:
        - NodePort
        - LoadBalancer
      required: false
      default: "NodePort"
    - name: storage_class
      description: "StorageClass for the game data volume (required)."
      type: k8sStorageClass
      required: true
    - name: storage_size
      description: "Game data volume size in Gi."
      type: int
      required: false
      default: 10
  # TODO: List commonly used custom environment variables for the upstream image.
  # Remove any that conflict with vars already set in scripts/chart/templates/server.yaml
  # (e.g. JUNO_WORKSTATION, JUNO_PROJECT, JUNO_ENVIRONMENT, USER, HOME, UID, GID, PREFIX).
  # Leave as an empty list (env_hints: |\n    []) if the image has no commonly used custom env vars.
    - name: restart_cron_schedule
      description: "Cron schedule for auto-restart (e.g., '0 4 * * *' for daily at 4 AM). Set empty to disable."
      type: string
      required: false
      default: "0 4 * * *"
  env_hints: |
    - name: TODO_VAR_NAME
      description: TODO — what this variable does and when to set it.
