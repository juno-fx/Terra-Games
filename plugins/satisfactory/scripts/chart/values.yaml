# These values are populated by Kuiper at workload launch time from the
# fields defined in templates/metadata.yaml. They must match field names
# exactly (dual-defaults parity: metadata defaults override these).
name: satisfactory
user:
registry: docker.io
repo: indifferentbroccoli/satisfactory-server-docker
tag: latest
group:
cpu: "2"
memory: "12Gi"
cpuLimit: ""
memoryLimit: ""
idx: 0
guid: 0
puid: 1000
host:
pullSecret:
session:
volumeMounts: []
volumes: []
env: []
plugins: []
_kuiper:

# --- game server settings ---

service_type: NodePort

# Graceful shutdown — the image's term_handler saves on SIGTERM; keep 30s
terminationGracePeriodSeconds: 30

# Ports are NOT configured here: satisfactory listens on its auto-derived
# nodePorts (game N UDP+TCP, reliable N+1 TCP) rendered from the instance
# name — see _helpers.tpl and the GAME_PORT/RELIABLE_PORT envs in
# server.yaml. Service port == nodePort == what the pod binds.

# Node pinning — the image is amd64-ONLY (its OCI index's second entry is
# an in-toto attestation, not an arm64 build). Pods must land on amd64 nodes.
nodeSelector:
  kubernetes.io/arch: amd64

# Sub-paths on the game data PVC:
#   files_subpath → /satisfactory (server files)
#   saves_subpath → /home/steam/.config/Epic/FactoryGame/Saved/SaveGames (world saves)
files_subpath: "satisfactory-files"
saves_subpath: "satisfactory-saves"

# --- launch-time field defaults (mirror metadata.yaml) ---

max_players: 4
branch: "public"
update_on_start: true
auto_pause: true
auto_save_on_disconnect: true
game_manifest: ""
steam_username: ""
steam_password: ""

# NodePort for the game port (0 = auto-derive an adjacent pair from the
# instance name; reliable = +1). Pick ≤ 32766 to pin.

# World storage — chart-rendered PVC (metadata fields)
storage_class: ""
storage_size: 25
restart_cron_schedule: "0 4 * * *"
