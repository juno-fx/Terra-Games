apiVersion: v1
kind: ConfigMap
metadata:
  name: "{{ .Release.Name }}-terra-metadata"
  labels:
    kuiper.juno-innovations.com/chart: "{{ .Release.Name }}-scripts-configmap"
  annotations:
    juno-innovations.com/workload: "Server"
data:
  chart: "{{ .Release.Name }}-scripts-configmap"
  description: "Enshrouded dedicated server (indifferentbroccoli image) — Windows server under Wine/Proton, non-crossplay (direct IP join)."
  fields: |
    - name: icon
      default: "https://raw.githubusercontent.com/aldmbmtl/Terra-Games/main/plugins/enshrouded/assets/logo.png"
    - name: registry
      description: "Container registry"
      type: string
      required: true
      default: "docker.io"
    - name: repo
      description: "Image repository"
      type: string
      required: true
      default: "indifferentbroccoli/enshrouded-server-docker"
    - name: tag
      description: "Image tag — latest, wine or proton"
      type: string
      required: true
      default: "latest"
    - name: server_name
      description: "Display name of the server"
      type: string
      required: true
      default: "Enshrouded Server"
    - name: server_password
      description: "Server password (stored in a Secret; leave blank for a public server)"
      type: string
      required: false
      sensitive: true
    - name: max_players
      description: "Maximum number of simultaneous players"
      type: int
      required: false
      default: 12
    - name: update_on_start
      description: "Download/validate server files on startup (false = skip, faster boots)"
      type: boolean
      required: false
      default: true
    - name: cpu
      description: "CPU cores (request)"
      type: string
      required: false
      default: "2"
    - name: memory
      description: "Memory request — 8GB min, 16GB recommended"
      type: string
      required: false
      default: "8Gi"
    - name: cpuLimit
      description: "CPU limit (empty = no limit)"
      type: string
      required: false
      default: ""
    - name: memoryLimit
      description: "Memory limit (empty = no limit)"
      type: string
      required: false
      default: ""
    - name: service_type
      description: "Service type — NodePort (high port on every node) or LoadBalancer (external IP via MetalLB/cloud LB)"
      type: select
      options:
        - NodePort
        - LoadBalancer
      required: false
      default: "NodePort"
    - name: storage_class
      description: "StorageClass for the server files + saves volume (required)."
      type: k8sStorageClass
      required: true
    - name: storage_size
      description: "Server volume size in Gi (20GB min, 40GB recommended)."
      type: int
      required: false
      default: 40
  env_hints: |
    - name: UPDATE_ON_START
      description: "false skips file validation on startup (faster restarts)"
    - name: QUERY_PORT
      description: "Query port (UDP) — fixed at 15637 by the chart"
    - name: restart_cron_schedule
      description: "Cron schedule for auto-restart (e.g., '0 4 * * *' for daily at 4 AM). Set empty to disable."
      type: string
      required: false
      default: "0 4 * * *"
